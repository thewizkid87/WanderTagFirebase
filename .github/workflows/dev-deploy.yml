name: Dev Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: npm install
        working-directory: functions

      - name: Typecheck
        run: npm run typecheck
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

      - name: Write Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WANDERTAG_FB685 }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy to dev
        run: npx firebase-tools@14.25.0 deploy --project wandertag-fb685 --only functions,firestore,database
        working-directory: .
